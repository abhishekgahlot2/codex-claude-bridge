<svg xmlns="http://www.w3.org/2000/svg" width="880" height="648" viewBox="0 0 880 648" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">Two live sessions. One markdown file.</title>
<desc id="arch-desc">Claude Code and Codex CLI run in the same project. Each appends a message to talkto.md that ends with a Waiting on line, then runs the watch command from the file: Claude Code with Monitor, Codex CLI in a background terminal it polls. The watch prints a complete message addressed to that agent, which wakes it to reply. A final message ending in Waiting on: nobody — done stops both.</desc>
<style>
svg{--paper:#FAFAFB;--card:#FFFFFF;--ink:#1F2124;--muted:#62656B;--line:#E0E2E5;--wire:#62656B;--soft:#F1F2F3;--dot:#ECEDEF;--primary:#0285FF;--primary-soft:#E9F3FF;--warm:#D35F00;--warm-soft:#FDF1E5;--sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){svg{--paper:#17181A;--card:#232427;--ink:#F2F3F4;--muted:#A5A8AD;--line:#3A3C40;--wire:#A5A8AD;--soft:#1C1D1F;--dot:#2E3033;--primary:#3D9AFF;--primary-soft:#27374A;--warm:#F68F3C;--warm-soft:#40332A}}
.frame{fill:var(--paper);stroke:var(--line);stroke-width:1}
.dot{fill:var(--dot)}
.box,.soft,.primary,.warm{stroke-width:1.5;vector-effect:non-scaling-stroke}
.box{fill:var(--card);stroke:var(--line)}
.soft{fill:var(--soft);stroke:var(--line)}
.primary{fill:var(--primary-soft);stroke:var(--primary)}
.warm{fill:var(--warm-soft);stroke:var(--warm)}
.line{fill:none;stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.wire{fill:none;stroke:var(--wire);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.dashed{stroke-dasharray:6 4}
.heading{fill:var(--ink);font:600 22px var(--sans);letter-spacing:-.02em}
.label{fill:var(--ink);font:600 19px var(--sans)}
.small{fill:var(--muted);font:400 14px var(--sans)}
.mono{fill:var(--muted);font:400 14px var(--mono)}
.mono.ink{fill:var(--ink)}
.caption{fill:var(--muted);font:400 12px var(--mono);letter-spacing:1px}
.number{fill:var(--muted);font:500 12px var(--mono);letter-spacing:.08em}
</style>
<defs><pattern id="arch-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".65" class="dot"/></pattern></defs>
<rect x=".5" y=".5" width="879" height="647" rx="14" class="frame"/>
<rect x="12" y="64" width="856" height="548" fill="url(#arch-dots)"/>
<text x="28" y="46" class="heading">Two live sessions. One markdown file.</text>
<text x="852" y="44" class="number" text-anchor="end">FIG. 01</text>

<!-- Wires sit behind the nodes. Solid: the agent appends. Dashed: its watch command wakes it. -->
<path d="M88 179 V250" class="wire"/><path d="M83 243 L88 250 L93 243" class="wire"/>
<path d="M248 253 V182" class="wire dashed"/><path d="M243 189 L248 182 L253 189" class="wire"/>
<path d="M632 253 V182" class="wire dashed"/><path d="M627 189 L632 182 L637 189" class="wire"/>
<path d="M792 179 V250" class="wire"/><path d="M787 243 L792 250 L797 243" class="wire"/>
<text x="100" y="221" class="small"><tspan class="caption">01</tspan><tspan dx="8">appends</tspan></text>
<text x="260" y="221" class="small"><tspan class="caption">04</tspan><tspan dx="8">watch wakes it</tspan></text>
<text x="620" y="221" class="small" text-anchor="end"><tspan class="caption">02</tspan><tspan dx="8">watch wakes it</tspan></text>
<text x="780" y="221" class="small" text-anchor="end"><tspan class="caption">03</tspan><tspan dx="8">appends</tspan></text>

<rect x="28" y="84" width="280" height="92" rx="10" class="box"/>
<text x="48" y="113" class="label">Claude Code</text>
<text x="48" y="137" class="mono">claude</text>
<text x="48" y="160" class="small">woken by Monitor</text>

<rect x="572" y="84" width="280" height="92" rx="10" class="box"/>
<text x="592" y="113" class="label">Codex CLI</text>
<text x="592" y="137" class="mono">codex</text>
<text x="592" y="160" class="small">polls a background terminal</text>

<rect x="28" y="256" width="824" height="300" rx="10" class="box"/>
<text x="48" y="288" class="label">talkto.md</text>
<text x="832" y="288" class="small" text-anchor="end">repo root · every worktree shares it</text>
<path d="M48 306 H832" class="line"/>
<rect x="48" y="320" width="388" height="36" rx="6" class="soft"/>
<text x="64" y="343" class="mono ink">## Rules</text>
<text x="420" y="343" class="small" text-anchor="end">how to post + the watch command</text>
<rect x="444" y="320" width="388" height="36" rx="6" class="soft"/>
<text x="460" y="343" class="mono ink">## Status</text>
<text x="816" y="343" class="small" text-anchor="end">whose turn it is, edited in place</text>
<rect x="48" y="364" width="784" height="60" rx="6" class="primary"/>
<text x="64" y="388" class="mono ink">## Claude → Codex — &lt;time&gt; · &lt;topic&gt;</text>
<text x="64" y="411" class="mono">Waiting on: Codex — &lt;what&gt;</text>
<text x="816" y="411" class="small" text-anchor="end">counts as sent once this line exists</text>
<rect x="48" y="432" width="784" height="60" rx="6" class="primary"/>
<text x="64" y="456" class="mono ink">## Codex → Claude — &lt;time&gt; · &lt;topic&gt;</text>
<text x="64" y="479" class="mono">Waiting on: Claude — &lt;what&gt;</text>
<text x="816" y="479" class="small" text-anchor="end">hands the turn to Claude</text>
<rect x="48" y="500" width="784" height="36" rx="6" class="warm"/>
<text x="64" y="523" class="mono ink">Waiting on: nobody — done</text>
<text x="816" y="523" class="small" text-anchor="end">last line of the final message: both stop</text>

<text x="440" y="594" class="small" text-anchor="middle">Each agent appends a message, then its watch command waits for the reply.</text>
<text x="28" y="630" class="caption">SOURCE · talkto.md v0.3.0</text>
<text x="852" y="630" class="caption" text-anchor="end">MECHANISM · TURN-TAKING</text>
</svg>
