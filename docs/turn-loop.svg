<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1150" viewBox="0 0 800 1150" role="img" aria-labelledby="turn-loop-title turn-loop-desc">
  <title id="turn-loop-title">One reply starts the next turn.</title>
  <desc id="turn-loop-desc">Time runs downward. Codex replies with WAITING in square brackets; its Stop hook appends nothing and listens. Claude finishes a turn, and its Stop hook appends a timestamped block. The file change wakes Codex’s waiting hook, which prints a block decision with the incoming message in reason. Codex receives the next prompt, replies, and its new Stop hook appends and waits. Claude’s waiting hook wakes, prints the same decision shape, and Claude continues. This repeats until a final reply marked DONE in square brackets is appended and delivered. WAITING and DONE markers act only at the start or end of a message.</desc>
  <style>
    .heading{fill:#183127;font-family:"IBM Plex Sans Condensed","IBM Plex Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:22px;font-weight:600;letter-spacing:-.22px}
    .label{fill:#183127;font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:19px;font-weight:600}
    .text{fill:#183127;font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:17px}
    .small{fill:#5b7164;font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px}
    .mono{fill:#5b7164;font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px}
    .caption{fill:#5b7164;font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;letter-spacing:1px}
    .number{fill:#5b7164;font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:500;letter-spacing:.88px}
    .box{fill:#fff;stroke:#c9d6ce;stroke-width:1.5}
    .soft{fill:#edf3ef;stroke:#c9d6ce;stroke-width:1.5}
    .green{fill:#ddefe3;stroke:#287856;stroke-width:1.5}
    .blue{fill:#e5ebf8;stroke:#5272b0;stroke-width:1.5}
    .orange{fill:#f8e9df;stroke:#a65a38;stroke-width:1.5}
    .line{fill:none;stroke:#c9d6ce;stroke-width:1.5}
    .wire{fill:none;stroke:#83988a;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .dashed{stroke-dasharray:5 6}
    .terminal{fill:#15251e;stroke:#496254;stroke-width:1.5}
    .terminal-text{fill:#dcebe1;font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px}
    .terminal-muted{fill:#97b5a3;font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px}
  </style>
  <defs>
    <pattern id="turn-loop-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#d4dfd7"/></pattern>
  </defs>
  <rect x=".75" y=".75" width="798.5" height="1148.5" rx="9" fill="#f8faf8" stroke="#c9d6ce" stroke-width="1.5"/>
  <rect x="12" y="88" width="776" height="1020" fill="url(#turn-loop-dots)"/>
  <text x="26" y="45" class="heading">One reply starts the next turn.</text>
  <text x="774" y="43" class="number" text-anchor="end">FIG. 02</text>
  <text x="26" y="74" class="small">Time runs downward. Each waiting hook listens to chat.md.</text>

  <!-- Lifelines and arrows are drawn before the event cards. -->
  <path d="M132 192 V936 M400 192 V936 M668 192 V936" class="line dashed"/>
  <g class="wire">
    <path d="M132 374 V396 H394 M387 391 L394 396 L387 401"/>
    <path d="M668 591 V610 M663 603 L668 610 L673 603"/>
    <path d="M668 682 V708 H406 M413 703 L406 708 L413 713"/>
    <path d="M132 919 V938 M127 931 L132 938 L137 931"/>
  </g>
  <path d="M406 450 H662 M394 778 H138" class="wire dashed"/>
  <path d="M655 445 L662 450 L655 455 M145 773 L138 778 L145 783" class="wire"/>

  <rect x="28" y="110" width="208" height="78" rx="12" class="terminal"/>
  <text x="44" y="142" class="terminal-text">Claude Code</text>
  <text x="44" y="168" class="terminal-muted">agent + Stop hook</text>
  <rect x="284" y="110" width="232" height="78" rx="10" class="green"/>
  <text x="304" y="141" class="label">chat.md</text>
  <text x="304" y="167" class="mono">~/.codex-bridge/</text>
  <rect x="564" y="110" width="208" height="78" rx="12" class="terminal"/>
  <text x="580" y="142" class="terminal-text">Codex CLI</text>
  <text x="580" y="168" class="terminal-muted">agent + Stop hook</text>

  <text x="548" y="222" class="caption">KICKOFF / LISTENER</text>
  <rect x="548" y="238" width="224" height="68" rx="10" class="blue"/>
  <text x="564" y="265" class="mono" style="fill:#5272b0">[WAITING]</text>
  <text x="564" y="290" class="small">No append; hook listens.</text>

  <rect x="28" y="310" width="208" height="58" rx="10" class="box"/>
  <text x="44" y="336" class="text">Claude turn ends</text>
  <text x="44" y="357" class="small">Stop hook runs</text>
  <text x="156" y="386" class="small">append block</text>
  <text x="156" y="421" class="mono">## claude @ &lt;ISO time&gt;</text>
  <circle cx="400" cy="396" r="4" fill="#287856"/>
  <rect x="28" y="454" width="208" height="44" rx="10" class="soft"/>
  <text x="44" y="481" class="mono">wait · fs.watch</text>

  <text x="424" y="436" class="small">waiting hook wakes</text>
  <rect x="538" y="486" width="234" height="99" rx="10" class="box"/>
  <text x="554" y="514" class="mono">{"decision":"block",</text>
  <text x="554" y="538" class="mono"> "reason":"&lt;message&gt;"}</text>
  <text x="554" y="566" class="small">Print → next prompt</text>
  <rect x="548" y="618" width="224" height="58" rx="10" class="box"/>
  <text x="564" y="644" class="text">Codex replies</text>
  <text x="564" y="665" class="small">New Stop hook runs</text>

  <text x="432" y="696" class="small">append block</text>
  <text x="432" y="735" class="mono">## codex @ &lt;ISO time&gt;</text>
  <circle cx="400" cy="708" r="4" fill="#287856"/>
  <rect x="548" y="764" width="224" height="44" rx="10" class="soft"/>
  <text x="564" y="791" class="mono">wait · fs.watch</text>
  <text x="156" y="764" class="small">waiting hook wakes</text>
  <rect x="28" y="814" width="234" height="99" rx="10" class="box"/>
  <text x="44" y="842" class="mono">{"decision":"block",</text>
  <text x="44" y="866" class="mono"> "reason":"&lt;message&gt;"}</text>
  <text x="44" y="894" class="small">Print → next prompt</text>

  <rect x="28" y="946" width="744" height="44" rx="10" class="soft"/>
  <text x="44" y="974" class="text">Claude replies → append → Codex wakes → …</text>
  <path d="M400 996 V1026 M395 1019 L400 1026 L405 1019" class="wire"/>
  <rect x="28" y="1034" width="744" height="68" rx="10" class="orange"/>
  <text x="44" y="1061" class="mono" style="fill:#a65a38">[DONE] / EITHER AGENT</text>
  <text x="44" y="1086" class="text">Final reply is appended and delivered. The exchange ends.</text>
  <text x="26" y="1131" class="small">[WAITING] and [DONE] act only at the start or end of a message.</text>
</svg>
